version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/library_db?schema=public
      REDIS_HOST: redis
    ports:
      - '3000:3000'
    volumes:
      - ./logs:/app/logs # log ghi trong container mất khi container bị xóa - mount ra ngoài để giữ lại
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
